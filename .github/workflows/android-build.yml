name: Build & Release Blogger Post Automation AI Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify and Package APK
        run: |
          mkdir -p build-artifacts
          APK_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Android Debug APK was not generated at app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "Verified Android APK generated: $APK_FILE"
          cp "$APK_FILE" build-artifacts/BloggerPostAutomationAI-debug.apk
          ls -lh build-artifacts/BloggerPostAutomationAI-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloggerPostAutomationAI-apk
          path: build-artifacts/BloggerPostAutomationAI-debug.apk
          retention-days: 30

      - name: Create GitHub Release & Publish APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/BloggerPostAutomationAI-debug.apk
          name: Blogger Post Automation AI ${{ github.ref_name }}
          body: |
            ### 📱 Blogger Post Automation AI - Official Android Release (${{ github.ref_name }})

            Direct installable APK build for Android 8.0+ devices.

            #### 🚀 Highlights & Features:
            - **Google Blogger API v3**: Multi-user Google account sign-in with granular Blogger permissions.
            - **Site-to-Site Post Import**: Fetch, rewrite, and publish posts from any public or owned Blogger site.
            - **Gemini AI Suite**:
              - Multilingual SEO title & caption generator (English & বাংলা).
              - Automated article rewrite, proofreading, and quality checks.
              - 16:9 responsive video-style thumbnail composer (1200×675).
            - **Privacy First**: Secure user token isolation and custom Gemini API key support.

            #### 📥 Download:
            Download **`BloggerPostAutomationAI-debug.apk`** below and tap to install on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
